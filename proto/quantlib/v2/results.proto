// Pricing results for the interactive QuantLib service, schema v2.
//
// This is the half of the schema the frontend draws from, and v1 got it
// wrong in one specific way: PriceResult carried `map<string, double>`, and
// QuantLib's own additionalResults is `map<string, ext::any>` holding vectors
// and matrices as well as scalars. The engines already publish "forwards",
// "probabilities", "spotVols", "TimeGrid" and per-leg "legNPV" — exactly the
// results worth plotting rather than printing — and a double-valued map drops
// every one of them silently.
//
// So: a variant value, a cash-flow table, and an explicit series type for the
// things a panel puts on an axis.

syntax = "proto3";

package quantlib.v2;

import "quantlib/v1/conventions.proto";
import "quantlib/v2/engine.proto";

option java_multiple_files = true;
option go_package = "quantlib/v2;quantlibv2";

// ---------------------------------------------------------------------------
// Values
// ---------------------------------------------------------------------------

// One result of any shape.
//
// Mirrors ext::any as QuantLib's engines actually use it. Nothing is coerced:
// a vector result arrives as a vector, and a client that wants a number from
// it decides which one.
message Value {
    oneof v {
        double scalar = 1;
        DoubleArray array = 2;
        DoubleMatrix matrix = 3;
        quantlib.v1.Date date = 4;
        string text = 5;
        bool flag = 6;
        DateArray dates = 7;
    }
}

message DoubleArray {
    repeated double values = 1 [packed = true];
}

// Row-major: values[i * columns + j].
message DoubleMatrix {
    uint32 rows = 1;
    uint32 columns = 2;
    repeated double values = 3 [packed = true];
    // Optional axis labels, so the frontend can render a surface without
    // being told separately what its axes are.
    repeated double row_labels = 4 [packed = true];
    repeated double column_labels = 5 [packed = true];
}

message DateArray {
    repeated quantlib.v1.Date values = 1;
}

// The standard results a client can ask for by name.
//
// Kept as an enum rather than left to the additional-results map because
// these are the ones the service computes on the instrument itself
// (ql/option.hpp:69-86, Greeks and MoreGreeks), and asking for one an engine
// cannot supply must be a named rejection rather than a missing map key.
enum ResultKind {
    RESULT_KIND_UNSPECIFIED = 0;
    RESULT_KIND_NPV = 1;
    RESULT_KIND_DELTA = 2;
    RESULT_KIND_GAMMA = 3;
    RESULT_KIND_THETA = 4;
    RESULT_KIND_VEGA = 5;
    RESULT_KIND_RHO = 6;
    RESULT_KIND_DIVIDEND_RHO = 7;
    RESULT_KIND_THETA_PER_DAY = 8;
    RESULT_KIND_DELTA_FORWARD = 9;
    RESULT_KIND_ELASTICITY = 10;
    RESULT_KIND_STRIKE_SENSITIVITY = 11;
    RESULT_KIND_ITM_CASH_PROBABILITY = 12;
    RESULT_KIND_IMPLIED_VOLATILITY = 13;
    // Quanto, from the QuantoOptionResults mixin
    // (ql/instruments/quantovanillaoption.hpp:34).
    RESULT_KIND_QRHO = 20;
    RESULT_KIND_QVEGA = 21;
    RESULT_KIND_QLAMBDA = 22;
    // Cash-flow instruments (ql/instruments/swap.hpp:135-137).
    RESULT_KIND_FAIR_RATE = 30;
    RESULT_KIND_FAIR_SPREAD = 31;
    RESULT_KIND_BPS = 32;
    RESULT_KIND_LEG_NPV = 33;
    RESULT_KIND_LEG_BPS = 34;
    RESULT_KIND_ACCRUED = 35;
    // Bonds
    RESULT_KIND_CLEAN_PRICE = 40;
    RESULT_KIND_DIRTY_PRICE = 41;
    RESULT_KIND_YIELD = 42;
    RESULT_KIND_DURATION = 43;
    RESULT_KIND_CONVEXITY = 44;
    // Credit
    RESULT_KIND_SURVIVAL_PROBABILITY = 50;
    RESULT_KIND_DEFAULT_LEG_NPV = 51;
    RESULT_KIND_COUPON_LEG_NPV = 52;
    RESULT_KIND_UPFRONT_NPV = 53;
}

// ---------------------------------------------------------------------------
// The result frame
// ---------------------------------------------------------------------------

message PriceResult {
    // Always present and always the instrument's own NPV, whatever else was
    // asked for.
    double npv = 1;

    // ISO 4217, when the instrument has one. Empty for a dimensionless price.
    string currency = 2;

    // Everything else, keyed by the name the client asked for
    // (ResultKind lower-camel: "delta", "legNPV") or by the engine's own
    // additional-result key when `include_additional_results` was set. The
    // two namespaces are the same on purpose: QuantLib's engines already use
    // "delta" for delta.
    map<string, Value> results = 3;

    // Monte Carlo only. A price without one is not comparable to another
    // price, and the frontend should be able to draw the band.
    message ErrorEstimate {
        double standard_error = 1;
        uint64 samples = 2;
    }
    ErrorEstimate error_estimate = 4;

    // The engine as it actually ran. Echoed rather than assumed: a batched
    // Monte Carlo is not the single-shot one, an FD price depends on its grid,
    // and a client comparing two numbers has to be able to see which is which
    // from the results alone (DESIGN §4).
    Engine engine = 5;

    double calculation_seconds = 6;

    // Optional, requested per call. Both are tables rather than numbers, and
    // both exist because the panel that shows a price wants to show its
    // working.
    repeated CashFlow cashflows = 7;
    repeated Series series = 8;
}

// One row of a leg's cash-flow table.
message CashFlow {
    // Which leg it belongs to, zero-based, for a multi-leg instrument.
    uint32 leg = 1;

    quantlib.v1.Date payment_date = 2;
    double amount = 3;

    // Present-value contribution: amount * discount. The sum over rows is the
    // NPV, which is the property that makes the table worth showing.
    double discount = 4;
    double present_value = 5;

    // Coupons only; zero on a redemption or a simple cash flow.
    quantlib.v1.Date accrual_start = 6;
    quantlib.v1.Date accrual_end = 7;
    double accrual_period = 8;
    double notional = 9;
    double rate = 10;

    // Floating coupons only.
    quantlib.v1.Date fixing_date = 11;
    double index_fixing = 12;
    double spread = 13;
    double gearing = 14;

    // True when index_fixing came from IndexManager rather than a forecast.
    bool is_past_fixing = 15;
}

// A line to plot.
//
// The general shape for everything a panel draws: a curve sampled over dates,
// a greek laddered over spot, a Monte Carlo convergence trace. One message
// rather than three because the frontend renders them identically and the
// axis labels are the only difference.
message Series {
    string name = 1;

    enum Axis {
        AXIS_UNSPECIFIED = 0;
        AXIS_DATE = 1;
        AXIS_TIME_YEARS = 2;
        AXIS_SPOT = 3;
        AXIS_STRIKE = 4;
        AXIS_RATE = 5;
        AXIS_VOLATILITY = 6;
        AXIS_SAMPLES = 7;
        AXIS_NPV = 8;
        AXIS_DISCOUNT_FACTOR = 9;
        AXIS_PROBABILITY = 10;
        AXIS_GREEK = 11;
    }
    Axis x_axis = 2;
    Axis y_axis = 3;

    // Exactly one x form, matching x_axis.
    repeated double x = 4 [packed = true];
    repeated quantlib.v1.Date x_dates = 5;

    repeated double y = 6 [packed = true];

    // Optional band, for a Monte Carlo trace or a confidence interval.
    repeated double y_low = 7 [packed = true];
    repeated double y_high = 8 [packed = true];
}

// ---------------------------------------------------------------------------
// Scenarios
// ---------------------------------------------------------------------------

// The result of a swept request: one price per scenario point.
//
// This is what the session model exists for. Re-pricing the same instrument
// against sixty spots costs one frame, one graph and sixty lazy recomputes of
// only what the bumped quote invalidated, instead of sixty round trips that
// each rebuild everything.
message ScenarioResult {
    // The quote that was written, and the values it took.
    string quote_id = 1;
    repeated double values = 2 [packed = true];

    // One per value, in order. The engine echo and timing live on the
    // enclosing PriceResult rather than being repeated per point.
    repeated PriceResult prices = 3;

    // The same data pre-shaped for a plot, when the client asked for one
    // result kind rather than the whole set.
    Series series = 4;
}
